name: Deploy Qoondeeye Admin

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and Deploy Qoondeeye Admin
        run: |
          set -e

          echo "========================================"
          echo "Starting Qoondeeye Admin deployment"
          echo "========================================"

          cd /home/mnx/qoondeeye-admin

          echo "=== Pulling latest source code ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Current commit ==="
          git rev-parse HEAD

          echo "=== Logging into GHCR ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

          echo "=== Building Docker image ==="
          docker build \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            -t ghcr.io/hirgal-technologies/qoondeeye-admin:latest \
            .

          echo "=== Pushing Docker image to GHCR ==="
          docker push ghcr.io/hirgal-technologies/qoondeeye-admin:latest

          echo "=== Starting new container ==="
          docker compose up -d --force-recreate

          echo "=== Waiting for application startup ==="
          sleep 10

          echo "=== Container status ==="
          docker compose ps

          echo "=== Health check ==="
          for i in 1 2 3 4 5; do
            if docker exec qoondeeye-admin \
              wget -qO- http://127.0.0.1:3000/api/health; then
              echo ""
              echo "Health check passed."
              break
            fi

            echo "Health check attempt $i failed. Waiting..."
            sleep 5

            if [ "$i" = "5" ]; then
              echo "Health check failed."
              docker logs qoondeeye-admin --tail 100
              exit 1
            fi
          done

          echo "=== Deployed image revision ==="
          docker inspect qoondeeye-admin \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'

          echo "=== Git revision ==="
          git rev-parse HEAD

          echo "=== Cleaning dangling images ==="
          docker image prune -f

          echo "========================================"
          echo "Deployment completed successfully"
          echo "========================================"
